<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 여행</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="common.css">
    <style>
        
        /* 전체 페이지 레이아웃 - 플렉스박스 사용 */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* 화면 전체 높이 사용 */
            background-color: #fff; /* 메인 배경색: 흰색 */
        }

        /* --- 메인 콘텐츠 영역 --- */
        main {
            flex: 1;
            padding: 30px 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* 새 여행 추가 버튼 */
        .add-btn {
            display: inline-block;
            background: none;
            padding-top: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* 큰 연회색 배경 박스 */
        .trip-box-container {
            background-color: #f5f5f5; /* 아주 밝은 회색 */
            border-radius: 12px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* 리스트 사이 간격 */
        }

        /* 여행 정보 가로 한 줄 (둥근 회색 알약 모양) */
        .trip-item {
            background-color: #d9d9d9;
            border-radius: 10px; /* 양 끝이 둥근 모양 */
            padding: 15px 30px;
            display: flex;
            justify-content: space-between; /* 요소들을 가로로 균등 분할 배치 */
            align-items: center;
        }

        .trip-name {
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 60px;
        }

        .trip-date {
            font-size: 0.9rem;
            color: #333;
        }

        .trip-location {
            font-size: 1rem;
        }

        .trip-companion {
            font-size: 1rem;
        }

        /* 수정 / 삭제 링크 */
        .trip-actions {
            display: flex;
            gap: 12px;
            font-size: 0.9rem;
            color: #666;
        }

        .trip-actions a {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .trip-actions a:hover {
            color: #000;
        }

    </style>
</head>
<body>

    <header>
        <img src="나들이_로고.png" alt="나들이 로고" class="logo" onclick="location.href='home.html'">
        <div class="menu-container">
            <div class="hamburger">☰</div>
            <ul class="dropdown">
                <li onclick="location.href='myTrip.html'">내 여행</li>
                <li onclick="location.href='myFriend.html'">내 친구</li>
                <li onclick="location.href='myPage.html'">내 정보</li>
                <li onclick="logout()">로그아웃</li>
            </ul>
        </div>
    </header>

    <main>
        <h2 class="title">내 여행</h2>
        <p class="add-btn" onclick="location.href='addTrip.html'">새 여행 추가 +</p>

        <!-- 자바스크립트가 동적으로 리스트를 생성할 공간 -->
        <div class="trip-box-container"></div>
    </main>

    <script src="common.js"></script>
    <script>
        // 👤 로그인한 유저의 고유 유저 키 획득 및 전용 여행 방 키 조립
        const loggedInUser = localStorage.getItem('loggedInUser');
        const userCode = loggedInUser ? JSON.parse(loggedInUser).code : 'guest';
        const tripsKey = `trips_${userCode}`; 

        window.addEventListener('DOMContentLoaded', function() {
            // 최초 실행 시 데이터가 없을 때만 유저 전용방에 샘플 데이터 세팅 (ID에 유저코드 결합해서 격리)
            if (!localStorage.getItem(tripsKey)) {
                const sampleTrips = [
                    { id: `trip1_${userCode}`, name: "여행1", date: "2026.05.25 ~ 2026.05.25", location: "숙대입구", companion: "혼자", totalDays: 1 },
                    { id: `trip2_${userCode}`, name: "여행2", date: "2026.05.23 ~ 2026.05.24", location: "제주도", companion: "홍길동", totalDays: 2 }
                ];
                localStorage.setItem(tripsKey, JSON.stringify(sampleTrips));
            }

            // 2. 내 전용 방에서 여행 목록 꺼내와서 화면에 그리기
            renderTrips();
        });

        // 📜 내 여행 목록을 화면에 동적으로 렌더링해주는 함수
        function renderTrips() {
            const trips = JSON.parse(localStorage.getItem(tripsKey)) || [];
            const container = document.querySelector('.trip-box-container');
            container.innerHTML = ''; // 기존 리스트 초기화

            // 등록된 여행이 하나도 없을 때의 예외 처리 안내문
            if (trips.length === 0) {
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: #888; font-size: 0.95rem;">아직 추가된 여행이 없습니다</div>`;
                return;
            }

            // 3. 데이터를 기반으로 행(Row) 생성하기
            trips.forEach((trip, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'trip-item';
                
                // ★ 핵심 수정: [수정], [삭제] 링크에 해당 아이템의 index를 넘겨주고 return false; 처리
                itemDiv.innerHTML = `
                    <span class="trip-name" onclick="location.href='tripDetail.html?id=${trip.id}'" style="cursor:pointer;">${trip.name}</span>
                    <span class="trip-date">${trip.date}</span>
                    <span class="trip-location">${trip.location}</span>
                    <span class="trip-companion">${trip.companion}</span>
                    <div class="trip-actions">
                        <a href="#" onclick="editTripName(${index}); return false;">수정</a>
                        <a href="#" onclick="deleteTrip(${index}); return false;">삭제</a>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        // ✏️ [수정] 링크 클릭 시 동작: 여행 이름(별명) 변경
        function editTripName(index) {
            const trips = JSON.parse(localStorage.getItem(tripsKey)) || [];
            const newName = prompt('여행 이름을 변경합니다', trips[index].name);

            // 공백이 아닌 올바른 글자를 입력했을 때만 반영
            if (newName && newName.trim()) {
                trips[index].name = newName.trim();
                localStorage.setItem(tripsKey, JSON.stringify(trips));
                renderTrips(); // 화면 실시간 새로고침
            }
        }

        // ✖ [삭제] 링크 클릭 시 동작: 여행 삭제 및 하위 일정 청소
        function deleteTrip(index) {
            const trips = JSON.parse(localStorage.getItem(tripsKey)) || [];
            const targetTrip = trips[index];

            // 지우기 전에 진짜 지울 건지 사용자에게 더블 체크
            if (confirm(`'${targetTrip.name}' 여행을 지우시겠습니까?\n해당 여행의 모든 데이터가 삭제됩니다.`)) {
                
                // 1) 데이터 찌꺼기가 남지 않게 이 여행의 총 일차(totalDays)만큼 돌면서 확정/제안 데이터 삭제
                for (let d = 1; d <= targetTrip.totalDays; d++) {
                    localStorage.removeItem(`confirmed_${userCode}_${targetTrip.id}_${d}`);
                    localStorage.removeItem(`suggested_${userCode}_${targetTrip.id}_${d}`);
                }

                // 2) 내 메인 여행 목록 배열에서 해당 데이터 잘라내고 로컬스토리지 저장
                trips.splice(index, 1);
                localStorage.setItem(tripsKey, JSON.stringify(trips));

                renderTrips(); // 화면 실시간 새로고침
            }
        }
    </script>
</body>
</html>
