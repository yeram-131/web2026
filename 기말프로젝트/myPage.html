<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="common.css">
    <style>
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fff; 
        }

        /* --- 메인 콘텐츠 영역 --- */
        main {
            flex: 1;
            padding: 30px 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* 프로필 이미지 원형 영역 */
        .profile-avatar {
            width: 75px;
            height: 75px;
            background-color: #d9d9d9; /* 이미지 없을 때 기본 회색 */
            border-radius: 50%;
            margin-bottom: 35px;
            background-size: cover;
            background-position: center;
        }

       
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 18px; 
        }

        .info-row {
            display: flex;
            align-items: center;
        }

    
        .info-label {
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            width: 90px; 
            flex-shrink: 0;
        }

    
        .info-value {
            background-color: #f1f1f1; 
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 1rem;
            color: #000;
            width: 100%;
            max-width: 450px; 
        }
    </style>
</head>
<body>

    <header>
        <img src="나들이_로고.png" alt="나들이 로고" class="logo" onclick="location.href='home.html'">
        <div class="menu-container">
            <div class="hamburger">☰</div>
            <ul class="dropdown">
                <li onclick="location.href='myTrip.html'">내 여행</li>
                <li onclick="location.href='myFriend.html'">내 친구</li>
                <li onclick="location.href='myPage.html'">내 정보</li>
                <li onclick="logout()">로그아웃</li>
            </ul>
        </div>
    </header>

    <main>
        <h2 class="title">내 정보</h2>
        
        <div class="profile-avatar" id="user-avatar"></div>

        <div class="info-list">
            
            <div class="info-row">
                <span class="info-label">이름</span>
                <div class="info-value" id="user-name">로딩 중...</div>
            </div>

            <div class="info-row">
                <span class="info-label">이메일</span>
                <div class="info-value" id="user-email">로딩 중...</div>
            </div>

            <div class="info-row">
                <span class="info-label">고유 코드</span>
                <div class="info-value" id="user-code">로딩 중...</div>
            </div>

        </div>
    </main>

    <footer>
        <img src="나들이_로고_글자.png" alt="나들이 로고" class="logo">
        <p class="copyright">© 2026. Yeram All rights reserved.</p>
    </footer>

    <script src="common.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // localStorage에서 로그인할 때 저장했던 유저 정보 꺼내기
            const loggedInUser = localStorage.getItem('loggedInUser');

            if (loggedInUser) {
                // 데이터가 존재하면 JSON 형태로 변환
                const user = JSON.parse(loggedInUser);

                // 화면의 각각 ID 요소에 진짜 데이터 매핑하기
                document.getElementById('user-name').innerText = user.name;
                document.getElementById('user-email').innerText = user.email;
                document.getElementById('user-code').innerText = user.code;

                // 프로필 사진 URL이 있으면 배경 이미지로 적용
                if (user.profileImg) {
                    document.getElementById('user-avatar').style.backgroundImage = `url('${user.profileImg}')`;
                }
            } else {
                // 혹시나 로그인 데이터 없이 이 페이지에 들어오면 로그인창으로 튕겨버리기
                alert('로그인이 필요한 페이지야! 로그인 화면으로 갈게.');
                location.href = 'login.html';
            }
        });
    </script>

</body>
</html>
