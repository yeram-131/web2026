<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 수정</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="common.css">

    <style>
        /* 전체 페이지 레이아웃 - 플렉스박스 사용 */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* 화면 전체 높이 사용 */
            background-color: #fff; /* 메인 배경색: 흰색 */
        }
        /* --- 메인 콘텐츠 영역 --- */
        main {
            flex: 1;
            padding: 30px 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        /* 여행 요약 정보 헤더 (가로 한 줄 라인) */
        .detail-header {
            display: flex;
            align-items: baseline;
            padding-bottom: 12px;
            border-bottom: 2px solid #000; /* 이미지 속 검은색 구분선 */
            margin-bottom: 20px;
            gap: 15px;
        }

        .back-btn {
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            padding: 0 5px;
        }

        .travel-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* 날짜, 장소, 동행인을 오른쪽으로 밀기 위한 래퍼 */
        .travel-meta {
            display: flex;
            gap: 25px;
            font-size: 0.95rem;
            margin-left: auto; /* 우측 정렬 효과 */
            align-items: center;
        }

        .travel-date {
            color: #333;
        }

        /* 1일차 & 일정 추가 행 */
        .day-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
        }

        .day-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .add-schedule-btn {
            font-size: 0.95rem;
            font-weight: bold;
            text-underline-offset: 3px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* 일정 리스트 감싸는 큰 박스 */
        .schedule-container {
            background-color: #f5f5f5;
            border-radius: 12px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 개별 일정 아이템 (둥근 바 형태) */
        .schedule-item {
            background-color: #d9d9d9;
            border-radius: 10px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 왼쪽 아이콘 + 장소명 묶음 */
        .schedule-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 순서 변경용 햄버거 모양 핸들 아이콘 */
        .handle-icon {
            font-size: 1.1rem;
            color: #333;
            cursor: grab; 
        }

        .place-name {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* 오른쪽 수정/삭제 버튼 */
        .schedule-actions {
            display: flex;
            gap: 12px;
            color: #666;
        }

        .schedule-actions a:hover {
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <img src="나들이_로고.png" alt="나들이 로고" class="logo" onclick="location.href='home.html'">
        <div class="menu-container">
            <div class="hamburger">☰</div>
            <ul class="dropdown">
                <li onclick="location.href='myTrip.html'">내 여행</li>
                <li onclick="location.href='myFriend.html'">내 친구</li>
                <li onclick="location.href='myPage.html'">내 정보</li>
                <li onclick="logout()">로그아웃</li>
            </ul>
        </div>
    </header>

    <main>
        <div class="detail-header">
            <button class="back-btn" onclick="location.href='tripDetail.html'">←</button>
            <span class="travel-title">여행2</span>
            
            <div class="travel-meta">
                <span class="travel-date">2026.05.23 ~ 2026.05.24</span>
                <span class="travel-location">제주도</span>
                <span class="travel-companion">홍길동</span>
            </div>
        </div>

        <div class="day-info-row">
            <h3 class="day-title">1일차</h3>
            <button class="add-schedule-btn" onclick="location.href='sharePlan.html'">일정 추가 +</button>
        </div>

        <div class="schedule-container">
            
            <div class="schedule-item">
                <div class="schedule-left">
                    <span class="handle-icon">☰</span>
                    <span class="place-name">아베베 베이커리</span>
                </div>
                <div class="schedule-actions">
                    <a href="#">수정</a>
                    <a href="#">삭제</a>
                </div>
            </div>

            <div class="schedule-item">
                <div class="schedule-left">
                    <span class="handle-icon">☰</span>
                    <span class="place-name">맛있는 고기국수</span>
                </div>
                <div class="schedule-actions">
                    <a href="#">수정</a>
                    <a href="#">삭제</a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <img src="나들이_로고_글자.png" alt="나들이 로고" class="logo">
        <p class="copyright">© 2026. Yeram All rights reserved.</p>
    </footer>

    <script src="common.js"></script>
    <script>
        // 전역 변수로 주소창 정보 분석 및 고유 스토리지 키 생성
        const urlParams = new URLSearchParams(window.location.search);
        const tripId = urlParams.get('id') || 'trip2';
        const day = urlParams.get('day') || '1';

        // 로그인한 유저 분석
        const loggedInUser = localStorage.getItem('loggedInUser');
        const userCode = loggedInUser ? JSON.parse(loggedInUser).code : 'guest';
        
       
        const dayKey = `confirmed_${tripId}_${day}`; 

        let draggedIndex = null; 

        window.addEventListener('DOMContentLoaded', function() {
            // 헤더 메타데이터 내 전용 방에서 채우기
            const tripsKey = `trips_${userCode}`;
            const trips = JSON.parse(localStorage.getItem(tripsKey)) || [];
            const currentTrip = trips.find(t => t.id === tripId) || trips[1];

            document.querySelector('.travel-title').innerText = currentTrip.name;
            document.querySelector('.travel-date').innerText = currentTrip.date;
            document.querySelector('.travel-location').innerText = currentTrip.location;
            document.querySelector('.travel-companion').innerText = currentTrip.companion;

            // 몇 일차 편집인지 타이틀 수정
            document.querySelector('.day-title').innerText = `${day}일차`;

            // 버튼들의 링크 경로도 파라미터 유지되도록 매핑
            document.querySelector('.back-btn').setAttribute('onclick', `location.href='tripDetail.html?id=${tripId}'`);
            document.querySelector('.add-schedule-btn').setAttribute('onclick', `location.href='sharePlan.html?id=${tripId}&day=${day}'`);

            // 2. 최초 리스트 화면에 그려주기
            renderList();
        });

        function renderList() {
            const scheduleContainer = document.querySelector('.schedule-container');
            scheduleContainer.innerHTML = ''; 
            const confirmedList = JSON.parse(localStorage.getItem(dayKey)) || [];
            if (confirmedList.length === 0) {
                scheduleContainer.innerHTML = `<div style="padding: 30px; text-align: center; color: #888; font-size: 0.95rem;">추가된 일정이 없습니다</div>`;
                return;
            }
            confirmedList.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'schedule-item';
                itemDiv.setAttribute('draggable', true);
                itemDiv.innerHTML = `
                    <div class="schedule-left">
                        <span class="handle-icon">☰</span>
                        <span class="place-name">${item.name}</span>
                    </div>
                    <div class="schedule-actions">
                        <a href="#" onclick="editPlanName(${index}); return false;">수정</a>
                        <a href="#" onclick="deletePlan(${index}); return false;">삭제</a>
                    </div>
                `;
                itemDiv.addEventListener('dragstart', () => { draggedIndex = index; itemDiv.style.opacity = '0.5'; });
                itemDiv.addEventListener('dragend', () => { itemDiv.style.opacity = '1'; });
                itemDiv.addEventListener('dragover', (e) => { e.preventDefault(); });
                itemDiv.addEventListener('drop', () => {
                    if (draggedIndex !== null && draggedIndex !== index) {
                        const list = JSON.parse(localStorage.getItem(dayKey)) || [];
                        const draggedItem = list.splice(draggedIndex, 1)[0];
                        list.splice(index, 0, draggedItem);
                        localStorage.setItem(dayKey, JSON.stringify(list));
                        renderList();
                    }
                });
                scheduleContainer.appendChild(itemDiv);
            });
        }

        function editPlanName(index) {
            const list = JSON.parse(localStorage.getItem(dayKey)) || [];
            const newName = prompt('장소 이름을 변경합니다', list[index].name);
            if (newName && newName.trim()) {
                list[index].name = newName.trim();
                localStorage.setItem(dayKey, JSON.stringify(list));
                renderList();
            }
        }

        function deletePlan(index) {
            const list = JSON.parse(localStorage.getItem(dayKey)) || [];
            if (confirm(`'${list[index].name}' 일정을 삭제하시겠습니까?`)) {
                list.splice(index, 1);
                localStorage.setItem(dayKey, JSON.stringify(list));
                renderList();
            }
        }
    </script>
</body>
</html>
