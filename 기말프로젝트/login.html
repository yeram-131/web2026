<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나들이 로그인</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>

    <style>
        body, h1, p, button { 
            margin: 0; 
            padding: 0; 
            font-family: "Pretendard Variable", sans-serif; box-sizing: border-box; 
        }
        body { 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #fff; 
        }

        header { 
            background-color: #202857; 
            padding: 5px; 
            color: #333; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        header .logo { 
            height: 70px; 
            padding: 5px; 
            width: auto; 
        }

        main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 40px; 
        }

        .login-section { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
        }
        .login-header { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px; 
        }
        .login-text { 
            font-size: 1.5rem; 
            font-weight: bold; 
            color: black; 
        }
        .login-button { 
            width: 280px; 
            padding: 15px; 
            background-color: #d9d9d9; 
            border: none; 
            border-radius: 5px; 
            font-size: 1.1rem; 
            color: black; 
            cursor: pointer; 
            text-align: center; 
            transition: background-color 0.2s; 
        }
        .login-button:hover { 
            background-color: #c0c0c0; 
        }

        footer { 
            background-color: #202857; 
            padding: 10px; 
            text-align: center; 
        }
        footer .logo { 
            height: 40px; 
            padding: 5px; 
            width: auto; 
        }
        footer .copyright { 
            font-size: 0.7rem; 
            color: #e6e6e6; 
        }
    </style>
</head>
<body>

    <header>
        <img src="나들이_로고.png" alt="나들이 로고" class="logo">
    </header>

    <main>
        <div class="login-section">
            <div class="login-header">
                <span class="login-text">로그인</span>
            </div>

            <button class="login-button google" onclick="loginWithGoogle()">구글</button>
            <button class="login-button kakao" onclick="loginWithKakao()">카카오</button>
        </div>
    </main>

    <footer>
        <img src="나들이_로고_글자.png" alt="나들이 로고" class="logo">
        <p class="copyright">© 2026. Yeram All rights reserved.</p>
    </footer>

    <script>
        let googleTokenClient;

        // 페이지 로드 시 구글 및 카카오 초기화
        window.onload = function () {
            // 1. 구글 초기화
            googleTokenClient = google.accounts.oauth2.initTokenClient({
                client_id: ' ', // 구글 ID
                scope: 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
                callback: (tokenResponse) => {
                    if (tokenResponse && tokenResponse.access_token) {
                        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                            headers: { 'Authorization': `Bearer ${tokenResponse.access_token}` }
                        })
                        .then(res => res.json())
                        .then(userInfo => {
                            saveAndRedirect({
                                name: userInfo.name,
                                email: userInfo.email,
                                profileImg: userInfo.picture,
                                code: 'G-' + userInfo.sub.slice(-6).toUpperCase() // 뒷자리 6자 사용
                            });
                        });
                    }
                },
            });

            // 2. 카카오 초기화
            if (typeof Kakao !== 'undefined') {
                Kakao.init(' '); // 카카오 JavaScript 키
            }
        };

        // 구글 로그인 실행
        function loginWithGoogle() {
            googleTokenClient.requestAccessToken();
        }

        // 카카오 로그인 실행
        function loginWithKakao() {
            Kakao.Auth.login({
                success: function(authObj) {
                    // 로그인 성공 시 사용자 정보 요청
                    Kakao.API.request({
                        url: '/v2/user/me',
                        success: function(res) {
                            saveAndRedirect({
                                name: res.kakao_account.profile.nickname,
                                email: res.kakao_account.email || '이메일 없음',
                                profileImg: res.kakao_account.profile.profile_image_url || '',
                                code: 'K-' + String(res.id).slice(-6) // 뒷자리 6자 사용
                            });
                        },
                        fail: function(error) { console.error(error); }
                    });
                },
                fail: function(err) { console.error(err); }
            });
        }

        // 공통 데이터 저장 및 이동 함수
        function saveAndRedirect(userData) {
            localStorage.setItem('loggedInUser', JSON.stringify(userData));
            
            // 전체 회원 명부에 등록해서 친구 찾기가 가능하게
            const allUsers = JSON.parse(localStorage.getItem('all_users')) || [];
            const isExist = allUsers.some(user => user.code === userData.code);
            if (!isExist) {
                allUsers.push({
                    name: userData.name,
                    code: userData.code
                });
                localStorage.setItem('all_users', JSON.stringify(allUsers));
            }

            alert(`${userData.name}님 환영합니다!`);
            location.href = 'home.html';
        }
    </script>

</body>
</html>
