<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 상세</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="common.css">
    <style>
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fff; 
        }

        /* --- 메인 콘텐츠 영역 --- */
        main {
            flex: 1;
            padding: 30px 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .detail-header {
            display: flex;
            align-items: baseline;
            padding: 12px;
            gap: 15px;
        }

        .back-btn {
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
            padding: 0 5px;
        }

        .travel-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

  
        .travel-meta {
            display: flex;
            gap: 25px;
            font-size: 0.95rem;
            margin-left: auto; 
            align-items: center;
        }

        .travel-date {
            color: #333;
        }


        .day-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .day-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .schedule-btn, .schedule-btn * {
            font-size: 0.95rem;
            background: none;
            border: none;
            cursor: pointer;
            margin-left: auto;
            padding-left: 15px;
            color: #606060;
        }

       
        .schedule-container {
            background-color: #f5f5f5;
            border-radius: 12px;
            padding: 25px 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .schedule-item {
            background-color: #d9d9d9;
            border-radius: 10px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

    
        .handle-icon {
            font-size: 1.1rem;
            color: #333;
            cursor: grab; 
        }

        .place-name {
            font-size: 1.1rem;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <header>
        <img src="나들이_로고.png" alt="나들이 로고" class="logo" onclick="location.href='home.html'">
        <div class="menu-container">
            <div class="hamburger">☰</div>
            <ul class="dropdown">
                <li onclick="location.href='myTrip.html'">내 여행</li>
                <li onclick="location.href='myFriend.html'">내 친구</li>
                <li onclick="location.href='myPage.html'">내 정보</li>
                <li onclick="logout()">로그아웃</li>
            </ul>
        </div>
    </header>

    <main>
        <div class="detail-header">
            <button class="back-btn" onclick="location.href='myTrip.html'">←</button>
            <span class="travel-title">여행2</span>
            
            <div class="travel-meta">
                <span class="travel-date">2026.05.23 ~ 2026.05.24</span>
                <span class="travel-location">제주도</span>
                <span class="travel-companion">홍길동</span>
            </div>
        </div>

        
        <div class="schedule-container">
            <div class="day-info-row">
                <h3 class="day-title">1일차</h3>
                <div class="schedule-btn">
                    <button onclick="location.href='editPlan.html'">수정</button>
                    <button onclick="location.href='map.html'">지도에서 보기</button>
                </div>
            </div>

            <div class="schedule-item">
                <div class="schedule-left">
                    <span class="place-name">아베베 베이커리</span>
                </div>
            </div>

            <div class="schedule-item">
                <div class="schedule-left">
                    <span class="place-name">맛있는 고기국수</span>
                </div>
            </div>
        </div>

        
        <div class="schedule-container">

            <div class="day-info-row">
                <h3 class="day-title">2일차</h3>
                <div class="schedule-btn">
                    <button>수정</button>
                    <button>지도에서 보기</button>
                </div>
            </div>

            <div class="schedule-item">
                <div class="schedule-left">
                    <span class="place-name">미술관</span>
                </div>
            </div>

            <div class="schedule-item">
                <div class="schedule-left">
                    <span class="place-name">막국수</span>
                </div>
            </div>
        </div>

    </main>

    <footer>
        <img src="나들이_로고_글자.png" alt="나들이 로고" class="logo">
        <p class="copyright">© 2026. Yeram All rights reserved.</p>
    </footer>

    <script src="common.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const loggedInUser = localStorage.getItem('loggedInUser');
            const userCode = loggedInUser ? JSON.parse(loggedInUser).code : 'guest';
            const tripsKey = `trips_${userCode}`; 

            // 1. 주소창에서 ?id=... 값 읽어오기
            const urlParams = new URLSearchParams(window.location.search);
            const tripId = urlParams.get('id') || 'trip2'; 

            // 2. 여행 정보 찾아서 헤더 바꾸기
            const trips = JSON.parse(localStorage.getItem(tripsKey)) || [];
            const currentTrip = trips.find(t => t.id === tripId) || trips[1];

            document.querySelector('.travel-title').innerText = currentTrip.name;
            document.querySelector('.travel-date').innerText = currentTrip.date;
            document.querySelector('.travel-location').innerText = currentTrip.location;
            document.querySelector('.travel-companion').innerText = currentTrip.companion;

            // 3. 일차만큼 동적 생성
            const mainContent = document.querySelector('main');
            const headerBlock = document.querySelector('.detail-header');
            mainContent.innerHTML = ''; 
            mainContent.appendChild(headerBlock); 

            for (let d = 1; d <= currentTrip.totalDays; d++) {
                const scheduleContainer = document.createElement('div');
                scheduleContainer.className = 'schedule-container';
                
                scheduleContainer.innerHTML = `
                    <div class="day-info-row">
                        <h3 class="day-title">${d}일차</h3>
                        <div class="schedule-btn">
                            <button onclick="location.href='editPlan.html?id=${tripId}&day=${d}'">수정</button>
                            <button onclick="location.href='map.html?id=${tripId}&day=${d}'">지도에서 보기</button>
                        </div>
                    </div>
                `;

                const dayKey = `confirmed_${tripId}_${d}`; 

                const confirmedList = JSON.parse(localStorage.getItem(dayKey)) || [];
                confirmedList.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'schedule-item';
                    itemDiv.innerHTML = `<div class="schedule-left"><span class="place-name">${item.name}</span></div>`;
                    scheduleContainer.appendChild(itemDiv);
                });

                mainContent.appendChild(scheduleContainer);
            }
        });
    </script>
</body>
</html>
